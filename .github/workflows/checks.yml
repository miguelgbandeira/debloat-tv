name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck -S warning install.sh build.sh tests/installer_test.sh
      - name: Installer tests (fake adb)
        run: bash tests/installer_test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DebloatTV.apk
          path: DebloatTV.apk
